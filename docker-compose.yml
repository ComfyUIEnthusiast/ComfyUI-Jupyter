services:
  comfyui:
    build: .
    container_name: comfyui-jupyter
    ports:
      - "8188:8188"  # ComfyUI
      - "8888:8888"  # Jupyter Notebook
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    volumes:
      - comfyui-models:/root/ComfyUI/models
      - comfyui-output:/root/ComfyUI/output
      - comfyui-user:/root/ComfyUI/user
    security_opt:
      - "label=type:nvidia_container_t"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
volumes:
    comfyui-models:
    comfyui-output:
    comfyui-user:
    
