[supervisord]
nodaemon=true
user=root

[program:comfyui]
command=python /root/ComfyUI/main.py
autostart=true
autorestart=true
stdout_logfile=/var/log/comfyui.log
stderr_logfile=/var/log/comfyui_err.log

[program:jupyter]
command=python -m notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root
autostart=true
autorestart=true
stdout_logfile=/var/log/jupyter.log
stderr_logfile=/var/log/jupyter_err.log