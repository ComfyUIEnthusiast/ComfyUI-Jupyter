[supervisord]
nodaemon=true
user=root

[program:comfyui]
command=python /root/ComfyUI/main.py --listen
autostart=true
autorestart=true
stdout_logfile=/var/log/comfyui.log
stderr_logfile=/var/log/comfyui_err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB

[program:jupyter]
command=python -m notebook --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token="z"
autostart=true
autorestart=true
stdout_logfile=/var/log/jupyter.log
stderr_logfile=/var/log/jupyter_err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
